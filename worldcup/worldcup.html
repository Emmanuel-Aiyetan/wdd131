<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search player cards from the top 10 ranked nations at the 2026 World Cup.">
    <meta name="author" content="Emmanuel Aiyetan">

    <meta property="og:type" content="website">
    <meta property="og:title" content="World Cup Player Cards">
    <meta property="og:description" content="Search player cards from the top 10 ranked nations at the 2026 World Cup.">
    <meta property="og:url" content="https://emmanuel-aiyetan.github.io/wdd131/worldcup/worldcup.html">
    <meta property="og:image" content="images/social-preview.png">

    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="World Cup Player Cards">
    <meta name="twitter:description" content="Search player cards from the top 10 ranked nations at the 2026 World Cup">
    <meta name="twitter:image" content="images/social-preview.png">
    <link rel="icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/worldcup-apple-touch-icon.png">
    <title>World Cup Player Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/worldcup.css">
    <script src="worldcup.js" defer></script>
</head>
<body>

<header>
    <div class="logo">
        <img src="images/logo.png" alt="World Cup Player Cards Logo" width="60" height="60">
        <div>
    <h1>World Cup Player Cards</h1>
    <p class="subtitle">Search the squads of the top 10 FIFA-ranked nations at the 2026 World Cup</p>
</header>

<main>

    <section class="search">
        <input
            id="search"
            type="text"
            placeholder="Search by name, country, or position">
        <button id="search-button">Search</button>
    </section>

    <section class="filters">
        <button class="filter-btn active" data-position="All">All</button>
        <button class="filter-btn" data-position="GK">GK</button>
        <button class="filter-btn" data-position="DEF">DEF</button>
        <button class="filter-btn" data-position="MID">MID</button>
        <button class="filter-btn" data-position="FWD">FWD</button>
    </section>

    <p class="hint">Tap a card to flip it and see club, caps, and goals.</p>

    <section id="card-container"></section>

</main>

<footer>
    <p> Emmanuel Aiyetan Final Project - WDD131 2026</p>
</footer>

</body>
</html>
