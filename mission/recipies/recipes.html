<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recipe Book with delicious recipes">
    <meta name="author" content="Emmanuel Aiyetan">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Find delicious recipes for every occasion.">
    <meta property="og:url" content="https://emmanuel-aiyetan.github.io/wdd131/mission/recipies/recipes.html">
    <meta property="og:image" content="images/social-preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Find delicious recipes for every occasion.">
    <meta name="twitter:image" content="images/social-preview.png">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/recipe-apple-touch-icon.png">
    <title>Recipe Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipes.css">
    <script src="recipes.js" defer></script>
</head>

<body>
<header>

    <div class="logo">
        <img src="images/recipe-book.png" 
        alt="Recipe Book Logo"
        width="350"
        height="120">
        <h1>RecipeBook</h1>
    </div>

</header>

<main>

    <section class="search">
        <input
            id="search"
            type="text"
            placeholder="Find a recipe">
        <button id="search-button">
            <img
                src="images/search.svg"
                alt="Search">
        </button>
    </section>

    <hr>

    <section id="recipe-container"></section>

</main>

<footer>

    <a href="https://www.flaticon.com/free-icons/recipe"
       title="recipe icons">
       Recipe icons created by Freepik - Flaticon
    </a>

    <div class="social">

        <a href="#">
            <img src="images/instagram_icon.svg" alt="Instagram">
        </a>

        <a href="#">
            <img src="images/youtube_icon.svg" alt="YouTube">
        </a>

        <a href="#">
            <img src="images/pinterest_icon.svg" alt="Pinterest">
        </a>

    </div>
</footer>
</body>
</html>
