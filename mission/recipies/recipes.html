<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recipe Book with delicious recipes">
    <meta name="author" content="Emmanuel Aiyetan">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Find delicious recipes for every occasion.">
    <meta property="og:url" content="https://yourgithubusername.github.io/wdd131/recipes">
    <meta property="og:image" content="images/social-preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Find delicious recipes for every occasion.">
    <meta name="twitter:image" content="images/social-preview.png">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/recipe-apple-touch-icon.png">
    <title>Recipe Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipes.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="images/recipe-book.png" 
        alt="Recipe Book Logo"
        width="350"
        height="120">
        <h1>RecipeBook</h1>
    </div>

</header>

<main>
    <section class="search">
        <input type="text" placeholder="Find a recipe">
        <button>
            <img src="images/search.svg" alt="Search">
        </button>
    </section>

    <hr>
    <article class="recipe-card">
        <img
            class="recipe-image"
            src="images/apple-crisp.jpg"
            alt="Apple Crisp"
            width="600"
            height="450">

        <section class="recipe-info">

            <span class="tag">dessert</span>

            <h2>Apple Crisp</h2>

            <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars">

                <span aria-hidden="true">⭐</span>
                <span aria-hidden="true">⭐</span>
                <span aria-hidden="true">⭐</span>
                <span aria-hidden="true">⭐</span>
                <span aria-hidden="true">☆</span>
            </span>

            <p class="description">
                This apple crisp recipe is a simple yet delicious fall dessert that's
                great served warm with vanilla ice cream.
            </p>

        </section>
    </article>
</main>

<footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
        Recipe icons created by Freepik - Flaticon
    </a>
    <div class="social">
    <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
    <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
    <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
    <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>                  
</footer>

</body>
</html>
