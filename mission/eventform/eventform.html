<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event Ticket Form">
    <meta name="author" content="Emmanuel Aiyetan">
    <title>Event Ticket</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>
<body>

<main class="wrapper">
    <h1>Event Ticket</h1>
    
    <form id="ticketForm">
        <div class="field">
            <label for="firstName">First Name</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                required>
        </div>

        <div class="field">
            <label for="lastName">Last Name</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                required>
        </div>

        <div class="field full">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required>
        </div>

        <div class="field">
            <label for="type">Type</label>

            <select
                id="type"
                name="type"
                aria-controls="extraField"
                required>

                <option value="">Choose one</option>
                <option value="student">Student</option>
                <option value="guest">Guest</option>

            </select>

        </div>

        <div class="field">
            <label for="eventDate">Event Date</label>

            <input
                type="date"
                id="eventDate"
                name="eventDate"
                required>

        </div>

        <div class="field full" id="extraField" hidden>

            <label for="extraInput" id="extraLabel"></label>

            <input
                type="text"
                id="extraInput"
                name="extraInput">

        </div>

        <button class="full" type="submit">
            Create Ticket
        </button>

    </form>

    <section id="output" aria-live="polite"></section>

</main>

</body>
</html>
